name: NOXIS Responsive QA
on:
  push:
    branches: [mobile-responsive]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/noxis-http.log 2>&1 &
          node tests/responsive.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noxis-responsive-screenshots
          path: qa-screenshots/
