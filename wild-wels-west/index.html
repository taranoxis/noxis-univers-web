<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WILD WELS WEST — Tara Noxis</title><link rel="icon" href="../assets/favicon.png"><style>
*{box-sizing:border-box}body{margin:0;color:#f5e4bd;background:#080b15;font-family:Georgia,serif;min-height:100vh;background-image:radial-gradient(ellipse at 75% 30%,#25344a 0,transparent 55%),radial-gradient(ellipse at 15% 80%,#40252c 0,transparent 50%)}header,main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:20px}a{color:inherit}header a,.back{display:inline-block;padding:10px 16px;border:1px solid #a68a58;border-radius:24px;text-decoration:none}h1{text-align:center;font-size:clamp(30px,6vw,65px);letter-spacing:.08em;margin:20px 0 8px}p{text-align:center;color:#c5bcae} .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;background:white;border-radius:50%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding:24px 0}.planet{text-decoration:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;min-height:160px;padding:12px;border-radius:16px}.planet:hover,.planet:focus-visible{background:#ffffff0b;outline:1px solid #a68a58}.sphere{display:block;width:var(--size,90px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 29% 24%,#fff8,transparent 35%),repeating-linear-gradient(155deg,transparent 0 9px,#ffffff12 10px 13px,transparent 16px),linear-gradient(140deg,var(--light),var(--dark));box-shadow:inset -18px -15px 25px #000b,0 0 28px var(--glow);transition:transform .35s}.planet:hover .sphere{transform:scale(1.12)}.detail{max-width:650px;margin:20px auto;text-align:center;padding:25px;border:1px solid #796846;border-radius:20px;background:#090e1bdf}.detail .sphere{margin:25px auto;--size:140px}audio{width:100%;margin:16px 0}img.cover{max-width:260px;width:100%;border-radius:12px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}footer{text-align:center;padding:24px;color:#a89c87}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.planet{min-height:145px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="stars" aria-hidden="true"></div><header><a href="../">← NOXIS UNIVERS</a><h1>WILD WELS WEST</h1><p>TARA NOXIS · Wels, Austria · 12 tracks</p></header><main id="main"></main><footer>Every song is a world of its own.</footer><script>
const tracks=Array.from({length:12},(_,i)=>({id:i+1,title:"",audio:"",cover:"",lyrics:"",payhip:""}));
const colors=[["#e2ab72","#59352c"],["#91c7d6","#21485d"],["#c1a0e3","#48315e"],["#a9c897","#294a3d"],["#d7c58c","#5d492b"],["#d88b82","#542a39"]];
const main=document.getElementById("main");
function sphere(i,big=false){const e=document.createElement("span");e.className="sphere";const c=colors[i%colors.length];e.style.setProperty("--light",c[0]);e.style.setProperty("--dark",c[1]);e.style.setProperty("--glow",c[0]+"55");if(!big)e.style.setProperty("--size",(65+(i*17)%40)+"px");e.setAttribute("aria-hidden","true");return e}
function node(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function render(){main.replaceChildren();const match=location.hash.match(/^#track-(\d+)$/);const t=match&&tracks.find(x=>x.id===Number(match[1]));if(t){const d=document.createElement("section");d.className="detail";const back=node("a","← Back to planets");back.href="#";back.className="back";d.append(back,sphere(t.id-1,true),node("h2",t.title||"Track "+String(t.id).padStart(2,"0")));if(t.cover){const img=document.createElement("img");img.src=t.cover;img.alt=t.title||"Track cover";img.className="cover";d.append(img)}if(t.audio){const a=document.createElement("audio");a.controls=true;a.preload="none";a.src=t.audio;d.append(a)}else d.append(node("p","Audio not yet available."));if(t.lyrics)d.append(node("pre",t.lyrics));if(t.payhip){const a=node("a","Buy on Payhip");a.href=t.payhip;d.append(a)}main.append(d)}else{main.append(node("p","Choose a planet to discover a track."));const g=document.createElement("div");g.className="grid";for(const t of tracks){const a=document.createElement("a");a.className="planet";a.href="#track-"+t.id;a.append(sphere(t.id-1),node("span",t.title||"Track "+String(t.id).padStart(2,"0")));g.append(a)}main.append(g)}}
for(let i=0;i<180;i++){const e=document.createElement("i");e.className="star";e.style.cssText="left:"+(i*137.53%100)+"%;top:"+(i*71.37%100)+"%;width:"+(i%17===0?2:1)+"px;height:"+(i%17===0?2:1)+"px;opacity:"+(.2+i%7/10);document.querySelector(".stars").append(e)}window.addEventListener("hashchange",render);render();
</script></body></html>
