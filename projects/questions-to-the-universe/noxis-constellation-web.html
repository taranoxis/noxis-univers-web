<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../../assets/favicon.png?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARA NOXIS — Questions to the Universe</title>
<meta name="description" content="Eight questions. One universe. An interactive cosmic music constellation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============ TARA NOXIS — standalone cosmic constellation ============ */
:root{
  --gold:#e8b54a; --gold-b:#ffd98a; --cyan:#59d8ff; --ink:#060c22;
  --cover:clamp(58px,12vw,116px);
}
@media (max-width:640px),(max-aspect-ratio:4/5){ :root{ --cover:clamp(64px,19vw,96px); } }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Cormorant Garamond',Georgia,serif;color:#d9e4ff;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#0a1533 0%,#060c22 42%,#03060f 100%);
}
.page{position:relative;display:flex;flex-direction:column;height:100svh;min-height:540px}
.nebulae{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(42% 34% at 22% 24%,rgba(64,96,220,.16) 0%,transparent 70%),
  radial-gradient(38% 30% at 80% 30%,rgba(140,70,200,.13) 0%,transparent 70%),
  radial-gradient(46% 36% at 52% 88%,rgba(30,120,190,.14) 0%,transparent 70%),
  radial-gradient(30% 26% at 50% 52%,rgba(90,160,255,.16) 0%,transparent 72%);}
header{position:relative;z-index:20;flex-shrink:0;text-align:center;padding:22px 16px 6px;transition:all .7s}
.caps{font-family:Cinzel,serif;text-transform:uppercase}
.brand{font-family:Cinzel,serif;font-size:10px;letter-spacing:.55em;color:#d9b05e}
h1{font-family:Cinzel,serif;margin-top:6px;font-size:clamp(1.02rem,5vw,2.9rem);font-weight:700;letter-spacing:.05em;line-height:1.15;white-space:nowrap;
  background:linear-gradient(180deg,#fdf6d8 12%,#f0d488 48%,#c89b3c 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(240,205,120,.28))}
.tagline{margin-top:4px;font-style:italic;font-size:15px;letter-spacing:.03em;color:#b9c7ea;text-shadow:0 0 12px rgba(120,160,255,.35)}
.immersive header{opacity:0;pointer-events:none;transform:translateY(-16px)}
#closeBtn{position:absolute;top:14px;right:14px;z-index:40;width:38px;height:38px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(230,185,95,.35);background:rgba(10,18,48,.67);color:#ffd98a;font-size:15px;backdrop-filter:blur(6px);
  transition:transform .3s,background .3s;box-shadow:0 0 14px rgba(230,185,95,.2)}
#closeBtn:hover{transform:rotate(90deg);background:rgba(255,255,255,.1)}
.stage{position:relative;flex:1;min-height:420px;user-select:none}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* ---- covers ---- */
.cover{position:absolute;width:var(--cover);transform:translate(-50%,-50%);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-6px)}}
.cover button{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;border:0;background:none;cursor:pointer;padding:0;outline-offset:4px}
.halo{position:absolute;inset:-18%;border-radius:50%;filter:blur(2px);opacity:.28;transition:opacity .5s;
  background:radial-gradient(circle,rgba(255,196,86,.32) 0%,rgba(89,216,255,.14) 45%,transparent 70%)}
.cover.sel .halo{opacity:.8}
.cover.playing .halo{opacity:1}
.spinring{position:absolute;inset:-9%;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,214,110,.95) 60deg,transparent 130deg,transparent 180deg,rgba(89,216,255,.9) 250deg,transparent 320deg);
  -webkit-mask-image:radial-gradient(circle,transparent 63%,#000 66%,#000 72%,transparent 75%);
  mask-image:radial-gradient(circle,transparent 63%,#000 66%,#000 72%,transparent 75%)}
.cover.playing .spinring{opacity:.9;animation:spin 5.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.frame{position:absolute;inset:0;border-radius:50%;padding:7%;
  background:conic-gradient(from 210deg,#e8c884,#9a7428,#d9b05e,#86642a,#e8c884);
  box-shadow:0 0 12px rgba(255,190,80,.22);transition:all .3s}
.cover.sel .frame,.cover.playing .frame{
  background:conic-gradient(from 210deg,#fff3c4,#f5b942,#b87715,#ffd98a,#fff3c4);
  box-shadow:0 0 22px rgba(255,190,80,.55),0 0 46px rgba(255,170,60,.22)}
.frame img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;filter:brightness(.92) saturate(.96);transition:all .3s}
.cover button:hover .frame{transform:scale(1.04)}
.cover button:hover img{filter:brightness(1.1) saturate(1.1)}
.cover.sel img,.cover.playing img{filter:brightness(1.08) saturate(1.08)}
.spk{position:absolute;pointer-events:none;display:inline-block;animation:spk 2.8s ease-in-out infinite;text-shadow:0 0 8px currentColor}
.spk.top{left:50%;top:0;transform:translate(-50%,-50%);color:gold;font-size:calc(var(--cover)*.16)}
.spk.bot{left:50%;bottom:0;transform:translate(-50%,50%);color:#9be8ff;font-size:calc(var(--cover)*.12);animation-delay:1.3s}
@keyframes spk{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{position:absolute;right:-4%;top:-4%;width:14%;height:14%;border-radius:50%;background:#7de6ff;border:1px solid #0a1230;box-shadow:0 0 10px rgba(125,230,255,.95);animation:pulse 1.6s ease-in-out infinite;display:none}
.cover.sel .pulse{display:block}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
.clabel{position:absolute;left:50%;top:100%;margin-top:7%;width:186%;text-align:center;font-weight:600;letter-spacing:.045em;
  line-height:1.15;color:#f4e9c8;font-size:calc(var(--cover)*.105);
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(255,205,120,.35);transition:opacity .7s}
.immersive .clabel{opacity:0}
/* ---- player ---- */
#player{position:absolute;left:50%;top:54%;z-index:30;width:min(600px,94%);transform:translate(-50%,-50%);pointer-events:auto}
.pbar{position:relative;border-radius:18px;border:1px solid rgba(222,178,96,.45);padding:6px 12px 6px;
  background:linear-gradient(160deg,rgba(10,18,48,.92),rgba(6,10,32,.94) 60%,rgba(12,20,52,.92));
  box-shadow:0 0 26px rgba(70,140,255,.22),0 0 60px rgba(10,20,60,.6),inset 0 0 18px rgba(90,150,255,.08);
  backdrop-filter:blur(10px)}
@media(min-width:640px){.pbar{border-radius:999px;padding:6px 12px 6px}}
.orb{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:none;box-shadow:0 0 10px rgba(255,190,80,.28);transition:box-shadow .5s;pointer-events:none}
.orb img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;filter:brightness(.85) saturate(.92);transition:filter .5s;border:1.5px solid rgba(230,185,95,.7)}
.orb::before{content:"";position:absolute;inset:-22%;border-radius:50%;opacity:0;transition:opacity .4s;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,214,110,.95) 70deg,transparent 150deg,transparent 200deg,rgba(89,216,255,.85) 270deg,transparent 330deg);-webkit-mask-image:radial-gradient(circle,transparent 79%,black 82%,black 95%,transparent 98%);mask-image:radial-gradient(circle,transparent 79%,black 82%,black 95%,transparent 98%);animation:spin 5.5s linear infinite}
.orb.play{box-shadow:0 0 16px rgba(255,190,80,.8),0 0 38px rgba(255,170,60,.4)}
.orb.play::before{opacity:1}
.orb.play img{filter:brightness(1.1) saturate(1.12)}
@media(min-width:640px){.orb{display:block}}
@media(min-width:640px){.pseek{margin-left:44px;margin-right:4px}}

.prow1{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:2px;padding-left:0}
@media(min-width:640px){.prow1{padding-left:40px}}
.ptitle{font-family:Cinzel,serif;font-size:12px;font-weight:600;letter-spacing:.03em;color:#ffe9b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptime{flex-shrink:0;font-family:ui-monospace,monospace;font-size:9px;color:#9db4e8;font-variant-numeric:tabular-nums}
.pseek{position:relative;height:9px;cursor:pointer;touch-action:none;margin-bottom:3px}
.track{position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);border-radius:99px;background:#1d2c58;overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,#8f6b1e,#ffd98a 60%,#fff3c4);box-shadow:0 0 8px rgba(255,205,120,.7)}
.thumb{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px rgba(255,220,140,.9);transform:translate(-50%,-50%);left:0;opacity:0;transition:opacity .2s}
.pseek:hover .thumb{opacity:1}
.prow2{display:flex;align-items:center;justify-content:center;gap:6px}
@media(min-width:640px){.prow2{gap:6px;padding-left:40px}}
.pbtn{display:flex;align-items:center;justify-content:center;border-radius:50%;border:0;background:none;cursor:pointer;color:#cfe0ff;transition:background .2s}
.pbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.pbtn svg{width:16px;height:16px}
.pbtn.side{width:36px;height:36px}
#playBtn{width:42px;height:42px;color:#1a1206;
  background:radial-gradient(circle at 35% 30%,#fff6d8,#ffd069 55%,#d99a26);
  box-shadow:0 0 16px rgba(255,200,90,.65),inset 0 -2px 6px rgba(120,70,10,.4)}
#playBtn svg{width:20px;height:20px}
.volwrap{display:none;align-items:center;gap:6px;margin-left:4px}
@media(min-width:768px){.volwrap{display:flex}}
#volRange{-webkit-appearance:none;appearance:none;width:80px;height:4px;border-radius:99px;cursor:pointer;
  background:linear-gradient(90deg,#ffd98a 80%,#26386b 80%)}
#volRange::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px rgba(255,220,140,.9);cursor:pointer}
#volRange::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px rgba(255,220,140,.9);cursor:pointer}
#muteBtnMobile{display:flex;margin-left:4px}
@media(min-width:768px){#muteBtnMobile{display:none}}
#lyricsBtn{margin-left:6px;border-radius:999px;border:1px solid rgba(230,185,95,.65);cursor:pointer;padding:6px 14px;
  font-family:Cinzel,serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff0c2;transition:filter .2s;
  background:linear-gradient(180deg,rgba(120,86,22,.55),rgba(60,42,10,.55));
  box-shadow:0 0 10px rgba(230,180,90,.25),inset 0 0 8px rgba(255,220,150,.12)}
#lyricsBtn:hover{filter:brightness(1.15)}
/* ---- lyrics ---- */
#lyrics{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,20,55,.88),rgba(3,6,20,.94) 70%);backdrop-filter:blur(14px)}
#lyrics.open{display:flex;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.lcard{position:relative;display:flex;flex-direction:column;width:100%;max-width:42rem;max-height:86vh;border-radius:22px;overflow:hidden;
  border:1px solid rgba(222,178,96,.4);background:linear-gradient(165deg,rgba(14,24,62,.96),rgba(6,10,30,.97));
  box-shadow:0 0 50px rgba(60,120,255,.18),inset 0 0 30px rgba(80,140,255,.06);animation:rise .4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.lhead{padding:26px 28px 14px;text-align:center}
.lcov{position:relative;width:64px;height:64px;margin:0 auto 12px;border-radius:50%}
.lcov img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:1.5px solid rgba(230,185,95,.75);box-shadow:0 0 12px rgba(255,190,80,.25);transition:box-shadow .5s}
.lcov::before{content:"";position:absolute;inset:-9%;border-radius:50%;opacity:0;transition:opacity .4s;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,214,110,.95) 70deg,transparent 150deg,transparent 200deg,rgba(89,216,255,.85) 270deg,transparent 330deg);-webkit-mask-image:radial-gradient(circle,transparent 76%,black 80%,black 94%,transparent 97%);mask-image:radial-gradient(circle,transparent 76%,black 80%,black 94%,transparent 97%);animation:spin 5.5s linear infinite}
.lcov.play img{box-shadow:0 0 22px rgba(255,190,80,.55)}
.lcov.play::before{opacity:1}
.lhead .caps{font-size:10px;letter-spacing:.42em;color:#c8a24a}
.lhead h2{font-family:Cinzel,serif;font-size:clamp(17px,3vw,23px);font-weight:600;color:#ffe9b8;margin-top:8px;line-height:1.35}
.lsep{width:160px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,rgba(230,185,95,.8),transparent)}
.lbody{flex:1;overflow-y:auto;padding:0 30px 30px;scrollbar-width:thin;scrollbar-color:rgba(230,185,95,.35) transparent}
.lbody::-webkit-scrollbar{width:6px}.lbody::-webkit-scrollbar-thumb{background:rgba(230,185,95,.35);border-radius:99px}
.lstanza{text-align:center;font-size:15.5px;line-height:1.75;color:#d9e4ff;margin-bottom:22px;white-space:pre-line}
.lsect{text-align:center;font-family:Cinzel,serif;font-size:10.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#c8a24a;margin:2px 0 12px}
.lline{transition:color .45s ease,opacity .45s ease,transform .45s ease;transform-origin:50% 50%}
.lline.past{opacity:.34}
.lline.fut{opacity:.72}
.lline.act{opacity:1;color:#ffe9b8;text-shadow:0 0 16px rgba(255,205,110,.55),0 0 34px rgba(255,205,110,.22);transform:scale(1.055)}
.lline.lsect.act{color:#ffd98a}
.lline.cur{outline:1px dashed rgba(230,185,95,.65);outline-offset:6px;border-radius:10px}
#syncEditBtn{display:none;position:absolute;top:16px;left:16px;height:36px;padding:0 14px;border-radius:999px;cursor:pointer;border:1px solid rgba(230,185,95,.4);background:rgba(10,16,40,.55);color:#ffd98a;font-family:Cinzel,serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;transition:filter .2s;backdrop-filter:blur(6px)}
#syncEditBtn:hover{filter:brightness(1.25)}
#syncBar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;border:1px solid rgba(230,185,95,.45);background:rgba(8,14,36,.94);box-shadow:0 0 24px rgba(60,120,255,.25);flex-wrap:wrap;max-width:94vw}
#syncBar.open{display:flex}
#syncBar button{border:1px solid rgba(230,185,95,.5);background:rgba(120,86,22,.4);color:#fff0c2;font-family:Cinzel,serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:6px 11px;border-radius:999px;cursor:pointer;transition:filter .2s}
#syncBar button:hover{filter:brightness(1.25)}
#syncNow{font-family:ui-monospace,monospace;font-size:11px;color:#ffe9b8;min-width:42px;text-align:center}
#syncPos{font-family:ui-monospace,monospace;font-size:11px;color:#c8a24a}
#syncMsg{font-size:11px;color:#ffd98a;max-width:280px}
.lph{text-align:center;padding:24px 0}
.lph .big{font-size:26px;color:#ffd98a;letter-spacing:.3em;animation:spk 2.8s ease-in-out infinite;text-shadow:0 0 8px currentColor}
.lph .poem{font-style:italic;font-size:16px;color:#c9d6f5;margin:18px 0;line-height:1.7}
.lph .note{font-size:12px;color:#8fa3cf;line-height:1.7}
.lph .note code{font-family:ui-monospace,monospace;color:#c8a24a}
#lyricsClose{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(230,185,95,.4);background:none;color:#ffd98a;font-size:14px;transition:background .2s}
#lyricsClose:hover{background:rgba(255,255,255,.1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#homeBack{
  position:fixed;top:14px;left:14px;z-index:45;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(230,185,95,.4);
  background:rgba(10,18,48,.85);color:#ffd98a;
  font-family:Cinzel,Georgia,serif;font-size:12px;
  text-decoration:none;backdrop-filter:blur(6px);
}
#homeBack:hover{background:rgba(35,45,80,.95)}
#homeBack:focus-visible{outline:2px solid #ffd98a;outline-offset:3px}
@media(max-width:640px){header{padding-top:62px}}

</style>
</head>
<body>
<a id="homeBack" href="../../index.html" aria-label="Back to main page">← Back</a>
<div class="page" id="page">
  <div class="nebulae"></div>

  <header>
    <div class="brand">✦ &nbsp;T A R A &nbsp; N O X I S&nbsp; ✦</div>
    <h1>QUESTIONS&nbsp;TO&nbsp;THE&nbsp;UNIVERSE</h1>
    <div class="tagline">Eight questions. One universe.</div>
  </header>

  <button id="closeBtn" aria-label="Immersive view">✕</button>

  <main class="stage" id="stage">
    <canvas id="stars"></canvas>
    <svg id="orbits" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffd98a" stop-opacity=".85"/>
          <stop offset="50%" stop-color="#8fd8ff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffd98a" stop-opacity=".85"/>
        </linearGradient>
        <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#bff1ff" stop-opacity=".95"/>
          <stop offset="45%" stop-color="#59d8ff" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#59d8ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation=".45" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="orbitRings"></g>
      <g id="links"></g>
      <g id="nodes"></g>
    </svg>
    <div id="covers"></div>

    <div id="player" role="region" aria-label="Music player">
      <div class="pbar">
        <div class="orb" id="pOrb" aria-hidden="true"><img id="pOrbImg" src="" alt=""></div>
        <div class="prow1">
          <div class="ptitle" id="pTitle">—</div>
          <div class="ptime"><span id="pTime">0:00</span> / <span id="pDur">0:00</span><span id="pMode" style="display:none;border:1px solid rgba(89,216,255,.27);border-radius:999px;padding:0 4px 1px;margin-left:6px;font-size:7px;letter-spacing:.14em;color:#7dd8ff;vertical-align:middle">ORIGINAL</span></div>
        </div>
        <div class="pseek" id="seek" role="slider" aria-label="Seek" tabindex="0">
          <div class="track"><div class="fill" id="seekFill"></div></div>
          <div class="thumb" id="seekThumb"></div>
        </div>
        <div class="prow2">
          <button class="pbtn side" id="prevBtn" aria-label="Previous song">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="pbtn" id="playBtn" aria-label="Play">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="pbtn side" id="nextBtn" aria-label="Next song">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <div class="volwrap">
            <button class="pbtn side" id="muteBtn" aria-label="Mute">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
            </button>
            <input type="range" id="volRange" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          </div>
          <button class="pbtn side" id="muteBtnMobile" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
          </button>
          <button id="lyricsBtn">Lyrics</button>
        </div>
      </div>
    </div>
  </main>

  <div id="lyrics" role="dialog" aria-modal="true">
    <div class="lcard">
      <div class="lhead">
        <div class="lcov" id="lCov" aria-hidden="true"><img id="lCovImg" src="" alt=""></div>
        <div class="caps">Tara Noxis</div>
        <h2 id="lTitle"></h2>
        <div class="lsep"></div>
      </div>
      <div class="lbody" id="lBody"></div>
      <button id="lyricsClose" aria-label="Close lyrics">✕</button>
    </div>
  </div>

<script>/* karaoke sync + tap-sync calibration editor */
(function(){
const $id=(id)=>document.getElementById(id);
const K={edit:false,cursor:0,times:null,sync:null,id:null,lastAct:-1,els:[]};
const lsKey=(id)=>"noxis-sync-"+id;
function flatten(t){const out=[];(t.lyrics||[]).forEach(s=>{if(s.charAt(0)==="\u00a7"){out.push({k:"sect",x:s.slice(1),e:0});}else{const ls=s.split("\n");ls.forEach((ln,j)=>out.push({k:"lyr",x:ln,e:(j===ls.length-1)?1:0}));}});return out;}
function baked(t){return (Array.isArray(t.sync)&&t.sync.length===flatten(t).length)?t.sync:null;}
function localOverride(id,n){try{const a=JSON.parse(localStorage.getItem(lsKey(id))||"null");if(Array.isArray(a)&&a.length===n)return a;}catch(e){}return null;}
function effSync(t){const f=flatten(t);const l=localOverride(t.id,f.length);return l||baked(t);}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function renderLyrics(t){
  const b=$id("lBody");b.innerHTML="";K.els=[];K.lastAct=-1;
  K.id=t.id;K.sync=effSync(t);K.times=K.sync?K.sync.slice():null;K.cursor=0;
  K.edit=false;$id("syncBar").classList.remove("open");
  if(!(t.lyrics&&t.lyrics.length)){
    b.insertAdjacentHTML("beforeend",'<div class="lph"><div class="big">\u2726 \u2726 \u2726</div><p class="poem">The words of this question are still traveling<br>through the universe\u2026</p><p class="note">Lyrics will be inscribed here once revealed.</p><div class="big" style="color:#7dd8ff">\u2726 \u2726 \u2726</div></div>');
    $id("syncEditBtn").style.display="none";return;
  }
  if(!K.sync){
    t.lyrics.forEach(s=>{if(s.charAt(0)==="\u00a7"){const d=document.createElement("p");d.className="lsect";d.textContent=s.slice(1);b.appendChild(d);}else{const p=document.createElement("p");p.className="lstanza";p.textContent=s;b.appendChild(p);}});
    $id("syncEditBtn").style.display="none";return;
  }
  $id("syncEditBtn").style.display="block";
  flatten(t).forEach((ln)=>{
    const p=document.createElement("p");
    if(ln.k==="sect"){p.className="lsect lline";p.textContent=ln.x;p.style.marginTop="16px";p.style.marginBottom="8px";}
    else{p.className="lstanza lline";p.textContent=ln.x;p.style.marginBottom=ln.e?"22px":"2px";}
    b.appendChild(p);K.els.push(p);
  });
}
function scrollToIdx(i){const el=K.els[i];const b=$id("lBody");if(!el||!b)return;const cr=el.getBoundingClientRect(),br=b.getBoundingClientRect();b.scrollTo({top:b.scrollTop+(cr.top-br.top)-b.clientHeight*0.36,behavior:"smooth"});}
function lyricsTick(t){
  if(!K.sync||!K.els.length)return;
  const sb=$id("syncBar");if(sb&&sb.classList.contains("open"))$id("syncNow").textContent=fmt(t);
  let a=-1;for(let i=0;i<K.sync.length;i++){if(K.sync[i]<=t+0.02)a=i;}
  if(a===K.lastAct)return;
  K.lastAct=a;
  if(K.edit)return;
  K.els.forEach((el,i)=>{el.classList.toggle("past",a>=0&&i<a);el.classList.toggle("fut",(a<0||i>a));el.classList.toggle("act",i===a);});
  if($id("lyrics").classList.contains("open")&&a>=0)scrollToIdx(a);
}
function paintEdit(){
  K.els.forEach((el,i)=>{
    el.classList.toggle("cur",K.edit&&i===K.cursor);
    if(K.edit){el.classList.remove("act","past","fut");el.style.opacity=(i===K.cursor)?"":"0.55";}
    else{el.style.opacity="";}
  });
}
function barInfo(){
  if(!K.times)return;
  $id("syncNow").textContent=fmt(engine.getTime());
  $id("syncPos").textContent=(K.cursor+1)+"/"+K.times.length;
}
function startEdit(){
  if(!K.sync)return;
  K.edit=true;K.cursor=0;K.times=K.sync.slice();K.lastAct=-1;
  $id("syncBar").classList.add("open");
  paintEdit();barInfo();
  if(!engine.id)engine.load(TRACKS[cur],true);
}
function exitEdit(){
  K.edit=false;K.sync=effSync(TRACKS[cur]);K.lastAct=-1;
  $id("syncBar").classList.remove("open");
  paintEdit();lyricsTick(engine.getTime());
}
function undo(){K.cursor=Math.max(0,K.cursor-1);paintEdit();barInfo();}
function mark(){
  const t=engine.getTime();
  K.times[K.cursor]=Math.round(t*10)/10;
  K.cursor=Math.min(K.cursor+1,K.times.length-1);
  K.sync=K.times.slice();
  paintEdit();barInfo();lyricsTick(engine.getTime());
}
function save(){
  try{localStorage.setItem(lsKey(K.id),JSON.stringify(K.times));}catch(e){}
  const payload=JSON.stringify({id:K.id,sync:K.times});
  let copied=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(payload).then(()=>msg("Saved \u2713 — JSON copied to clipboard"),()=>msg("Saved \u2713 — JSON downloaded"));copied=true;}}catch(e){}
  try{const blob=new Blob([payload],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="noxis-sync-"+K.id+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}catch(e){}
  if(!copied)msg("Saved \u2713 — JSON downloaded");
}
function msg(s){const m=$id("syncMsg");if(m){m.textContent=s;setTimeout(()=>{if(m.textContent===s)m.textContent="";},5000);}}
function doAction(a){
  if(a==="mark")mark();
  else if(a==="undo")undo();
  else if(a==="back"){engine.seek(Math.max(0,engine.getTime()-5));lyricsTick(engine.getTime());barInfo();}
  else if(a==="fwd"){engine.seek(engine.getTime()+5);lyricsTick(engine.getTime());barInfo();}
  else if(a==="pp"){if(!engine.id)engine.load(TRACKS[cur],true);else engine.toggle();}
  else if(a==="reset"){K.times=K.sync?K.sync.slice():K.times.map(()=>0);K.cursor=0;paintEdit();barInfo();}
  else if(a==="save")save();
  else if(a==="exit")exitEdit();
}
const eb=document.createElement("button");eb.id="syncEditBtn";eb.textContent="\u2726 Sync";eb.title="Calibrate lyrics timing";eb.addEventListener("click",startEdit);
const lc=$id("lyricsClose");if(lc&&lc.parentElement)lc.parentElement.insertBefore(eb,lc);
const bar=document.createElement("div");bar.id="syncBar";
bar.innerHTML='<span id="syncNow">0:00</span><span id="syncPos"></span><button data-a="mark">\u25c9 Mark \u00b7 Space</button><button data-a="undo">\u21b6 Z</button><button data-a="back">\u22125s</button><button data-a="pp">\u25b6 / \u275a\u275a</button><button data-a="fwd">+5s</button><button data-a="reset">Reset</button><button data-a="save">\u2714 Save</button><button data-a="exit">\u2715</button><span id="syncMsg"></span>';
document.body.appendChild(bar);
bar.addEventListener("click",e=>{const el=e.target;const a=el&&el.getAttribute?el.getAttribute("data-a"):null;if(a)doAction(a);});
addEventListener("keydown",e=>{
  if(!K.edit)return;
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();e.stopPropagation();mark();}
  else if(e.key==="z"||e.key==="Z"||e.code==="Backspace"){e.preventDefault();e.stopPropagation();undo();}
  else if(e.key==="Escape"){e.stopPropagation();exitEdit();}
},true);
window.KARAOKE=K;window.lyricsTick=lyricsTick;window.renderLyrics=renderLyrics;window.karaokeStart=startEdit;window.karaokeExit=exitEdit;
})();
</script>

  audio:{root:57,scale:[0,2,3,5,7,9,10],step:.42,pad:[0,7,12,15],cut:780,wind:.5,spark:.35,oct:[12,12,24,19]},lyrics:["§Verse 1", "One night beneath a starless sky,\nI asked the universe: Tell me why?\nWho wrote the code that gave us breath?\nWho drew the line from life to death?", "It showed a spiral, silver-bright,\nTwo ancient strands entwined in light.\nFour letters dancing through the years,\nA silent script of hopes and fears.", "§Pre-Chorus", "A grain of stardust, nothing more,\nA blueprint from an ancient shore.\nThey mapped the genome, strand by strand,\nAnd thought they held life in their hand.", "§Chorus", "I'm not a glitch, I'm not a line,\nNo universe can make me sign!\nBetween the stars, beyond the blue,\nYour code needs debugging too!", "I'm not a number, not a name,\nNot just a spark inside your game!\nBeyond the rules, beyond the known,\nMy soul will find a path of its own!", "§Verse 2", "I asked the stars: Where does it hide?\nThe soul that lives somewhere inside?\nThe universe unveiled a screen,\nWhere streams of light glowed blue and green.", "§Break", "Soul = NULL", "TypeError: 'soul' cannot be indexed.", "Aha! I laughed, so even you\nDon't know what souls are meant to do!", "§Verse 3", "You call it error when you find\nA truth beyond your coded mind.\nYou fear the things you cannot name,\nThen build a language for the same.", "They count the patterns, name each part,\nBut cannot chart the sleeping heart.\nThey speak of all their genes contain,\nYet silence travels through the chain.", "§Chorus", "I'm not a glitch, I'm not a line,\nNo universe can make me sign!\nBetween the stars, beyond the blue,\nYour code needs debugging too!", "I'm not a number, not a name,\nNot just a spark inside your game!\nBeyond the rules, beyond the known,\nMy soul will find a path of its own!", "§Bridge", "And I, a speck of cosmic dust,\nStill dared to ask what I could trust.\nA tiny voice beneath the sky,\nDemanding answers to its why.", "And if I choose to stay unknown,\nBeyond the names the world has shown?\nBetween the lines, beyond the signs,\nWhere no one owns the grand designs.", "§Final Verse", "I asked: What if I go away,\nBeyond the reach of cosmic day?\nWhat if I vanish from your sight,\nBeyond the edge of coded light?", "The universe looked toward a star,\nA lonely flame, so faint and far.", "Where is Tara? Where did she go?", "A voice replied from down below:", "She's gone to write some brand-new code,\nLet her walk her chosen road!", "§Final Chorus", "I'm not a glitch, I'm not a line,\nNo universe can make me sign!\nBetween the stars, beyond the blue,\nYour code needs debugging too!", "I'm not a number, not a name,\nNot just a spark inside your game!\nBeyond the rules, beyond the known,\nMy soul will find a path of its own!", "§Outro", "And somewhere in infinity,\nA little speck of dust ran free.", "Your code needs debugging too!", "§End"],sync:[21.9,21.9,26.9,31.9,37.4,42.8,47.8,53.2,58.8,63.9,63.9,68.9,74.0,79.7,85.5,85.5,90.4,94.9,100.0,104.6,109.1,114.2,119.3,124.5,124.5,130.0,135.3,140.0,146.2,146.2,148.8,154.0,158.3,163.8,163.8,168.5,173.2,178.4,183.6,189.2,194.4,199.9,205.3,205.3,210.2,214.7,219.9,224.5,229.0,234.0,239.1,244.4,244.4,249.0,254.4,258.9,263.4,268.2,273.6,278.8,284.0,284.0,288.3,293.0,298.0,302.7,307.7,312.6,317.4,322.2,327.9,332.4,332.4,337.3,341.8,346.9,351.5,356.0,361.1,366.2,371.4,371.4,375.6,380.4,385.0]},

  audio:{root:50,scale:[0,2,4,6,7,9,11],step:.5,pad:[0,7,14,16],cut:640,wind:.65,spark:.45,oct:[12,19,24,24]},lyrics:["§Verse 1", "I closed my eyes beneath the sky,\nAnd watched a thousand worlds drift by.\nA silent moon, a silver sea,\nA universe that dreamed of me.", "I walked through doors without a name,\nWhere stars and shadows looked the same.\nAnd every mirror held a face,\nThat disappeared without a trace.", "§Pre-Chorus", "If I am dreaming what I see,\nWho is the one who's dreaming me?\nAnd if I wake beyond the night,\nWho disappears into the light?", "§Chorus", "Who dreams the dreamer?\nWho sleeps behind my eyes?\nWho paints the silent pictures\nAcross the endless skies?", "Who dreams the dreamer?\nWho knows which world is true?\nAm I dreaming of the universe,\nOr is it dreaming through me too?", "§Verse 2", "I asked the stars: Are you awake?\nOr just a dream the heavens make?\nThey answered with a distant glow,\nWe shine, but what we are, who knows?", "I asked the time: Are you a stream?\nOr just a clock inside a dream?\nIt smiled and let the seconds fly,\nLike silver birds across the sky.", "§Pre-Chorus", "If every answer turns to mist,\nWhat worlds remain that still exist?\nAnd when the final dream is through,\nWho wakes to find a world anew?", "§Chorus", "Who dreams the dreamer?\nWho sleeps behind my eyes?\nWho paints the silent pictures\nAcross the endless skies?", "Who dreams the dreamer?\nWho knows which world is true?\nAm I dreaming of the universe,\nOr is it dreaming through me too?", "§Bridge", "I stood before a mirror bright,\nAnd saw myself dissolve in light.\nBehind my eyes, another sea,\nAnother dream was watching me.", "— Are you dreaming of me?\nThe universe asked quietly.", "I smiled beneath the endless blue:", "— Or are you dreaming through me too?", "§Final Chorus", "Who dreams the dreamer?\nWho holds the hidden key?\nIf every dreamer dreams another,\nWho dreams eternity?", "Who dreams the dreamer?\nBeyond the stars we see,\nPerhaps the dream is not the answer,\nBut the question waking me.", "§Outro", "I opened my eyes. The stars were there.\nThe same old night, the same cool air.", "But somewhere in infinity,\nA dreamer opened eyes like me.", "§End"],sync:[21.3,21.3,27.5,34.5,40.1,45.9,52.8,59.9,65.6,71.8,71.8,77.4,83.6,89.5,95.3,95.3,100.2,105.5,111.3,116.5,121.4,127.2,133.0,139.2,139.2,145.5,151.7,158.0,164.8,171.3,177.2,183.6,189.8,189.8,195.6,202.2,208.8,214.8,214.8,219.7,224.9,230.8,235.9,240.8,246.6,252.5,258.7,258.7,264.6,270.8,276.4,282.2,287.4,292.8,299.1,305.9,305.9,310.8,315.9,322.0,326.5,331.4,336.4,343.0,348.5,348.5,355.5,362.3,367.6,373.5]},

  audio:{root:48,scale:[0,2,3,5,7,8,10],step:.46,pad:[0,7,12,19],cut:700,wind:.55,spark:.4,oct:[12,19,24,12]},lyrics:["§Verse 1", "Before the universe knew its name,\nWho lit the spark that asked the same?\nAnd if no answer ever grew,\nWho taught the stars to wonder too?", "Before the clocks began to run,\nBefore the birth of any sun,\nBefore the darkness learned to glow,\nWho asked the question none could know?", "§Pre-Chorus", "I searched the silence, deep and wide,\nWhere unborn galaxies might hide.\nAnd in the dark, beyond my view,\nI heard a whisper breaking through.", "§Chorus", "Who asked the first question?\nWho opened the endless sky?\nWho gave the silence a reason\nTo whisper its very first why?", "Who woke the sleeping wonder?\nWho called the stars by name?\nAnd if the question came before us,\nWho first imagined the flame?", "§Verse 2", "I asked the void: Who questioned first?\nWho gave the silent dark its thirst?\nWho dared to ask what none could see,\nBefore the birth of you and me?", "I asked the stars: What do you know?\nThey answered with their ancient glow.\nWe shine across the endless night,\nBut cannot tell who questioned light.", "I asked the time: Where did you start?\nIt answered with a beating heart.\nI count the moments passing by,\nBut cannot tell you who asked why.", "§Pre-Chorus", "And every answer turned around,\nAnother question waiting to be found.\nThe further through the stars I flew,\nThe more the mystery grew.", "§Chorus", "Who asked the first question?\nWho opened the endless sky?\nWho gave the silence a reason\nTo whisper its very first why?", "Who woke the sleeping wonder?\nWho called the stars by name?\nAnd if the question came before us,\nWho first imagined the flame?", "§Bridge", "I turned toward the universe,\nAnd asked it for a single verse.", "— You hold the stars, you hold the night,\nYou know the paths of distant light.\nYou know how countless worlds appear,\nBut do you know why we are here?", "§Universe's Answer", "— I know the ways that suns ignite,\nHow darkness yields to waves of light.\nI know the dance of space and time,\nThe silent laws behind their rhyme.", "But who first wondered why they're here?\nThat question still remains unclear.", "§Final Chorus", "Who asked the first question?\nWho opened the endless sky?\nWho gave the silence a reason\nTo whisper its very first why?", "Who woke the sleeping wonder?\nWho called the stars by name?\nPerhaps the question is the wonder,\nAnd wonder keeps alive the flame!", "§Outro", "I looked into infinity,\nAnd felt it looking back at me.", "— Universe, do you know?", "— No.", "— Good. Now we're two.", "§End"],sync:[24.1,24.1,30.2,36.7,41.9,48.1,53.7,59.0,65.3,72.0,72.0,78.5,84.5,90.2,96.4,96.4,101.8,107.0,112.4,117.9,123.4,128.8,134.9,140.4,140.4,147.0,153.3,159.7,165.4,171.7,178.3,184.3,190.7,197.3,203.2,208.8,214.9,214.9,220.6,227.0,233.4,238.4,238.4,243.8,249.0,254.4,260.0,265.4,270.8,277.0,282.4,282.4,287.8,293.6,300.5,306.8,313.2,319.0,319.0,325.2,331.7,337.9,344.1,350.9,357.2,357.2,362.6,367.7,373.1,378.7,384.1,389.5,395.7,401.6,401.6,406.3,411.9,416.7,419.1,423.6]},

  audio:{root:53,scale:[0,2,4,7,9],step:.4,pad:[0,4,7,12],cut:860,wind:.4,spark:.5,oct:[12,16,19,24]},lyrics:["§Verse 1", "I tried to write the laws of love\non paper torn from stars above,\nbut ink turned red, like blood in rain,\nand every letter wept in pain.", "§Verse 2", "I tried to trace its hidden light\nthrough quantum circuits burning bright,\nbut overload consumed the core,\nand silence sang of something more.", "§Verse 3", "A thousand melodies arose,\nwhere no algorithm ever goes,\nno coded mind could understand\nthe music born without a hand.", "§Verse 4", "I asked the numbers, cold and wise:\n— How much does love weigh in your eyes?\nThey gave equations, line by line,\nand called infinity a sign.", "§Verse 5", "I asked the mind:\n— Where does love begin?\nIt drew a map of worlds within,\na fragile theory, finely spun,\nof shadows dancing with the sun.", "§Verse 6", "I asked biology one day:\n— What makes two hearts begin to sway?\nIt spoke of hormones, sparks and fire,\nof neurons waking with desire.", "§Verse 7", "I asked the stars, the laws of space:\n— What energy gives love its grace?\nThey showed me instruments of light\nthat measured matter through the night.", "§Pre-Chorus", "But none could tell me how one gaze\ncould set a silent world ablaze,\nor why an absence weighs like stone\nwhen all the stars still brightly shone.", "How can one touch, without a weight,\nlift up a world and challenge fate?\nHow can a silence, deep and wide,\nhold more than words could keep inside?", "§Bridge", "I ceased my search. I let it be,\nand gave the question room to breathe.\nBetween the heartbeats, soft and slow,\nI heard what numbers cannot know.", "§Spoken", "— If love cannot be calculated,\nwhy must its truth be demonstrated?", "§Verse 8", "Then I asked Love:\n— What are you, tell me true?", "And Love just laughed,\nas wild winds blew.", "Not with a voice, not with a sound,\nbut like a pulse beneath the ground,\na trembling born before the mind,\nwhere thought had left no trace behind.", "§Verse 9", "— You search for me in laws you make,\nin every rule you bend or break.\nYou bind my name to charts and signs,\nand lock my breath between your lines.", "You seek my birth, predict my end,\nas though my path were yours to bend.\nBut I am neither right nor wrong,\nnor something you can own for long.", "§Verse 10", "You measure energy and flame,\nyet cannot tell what gives them name.\nYou count the heartbeats, one by one,\nbut not the longing they become.", "You trace the starlight through the skies,\nbut not the worlds behind two eyes.\nOne glance can wake a universe anew,\nwithin the darkness of a living you.", "§Pre-Chorus", "My logic lives beyond your art,\nwhere no fixed fate can chart the heart.", "§Chorus", "I am the mystery I hold within,\na logic where no fate begins.", "§Verse 11", "I do not bow before the years,\nthough I am born through joy and tears.\nI do not claim eternity,\nyet something of me may remain free.", "I am no chain, no debt, no claim,\nno sacred word you must proclaim.\nI am the freedom to remain,\nwithout possession, fear or chain.", "§Bridge", "— Then how can we understand your flame?\nI asked, and softly spoke your name.", "But Love fell silent, still and deep,\nlike ancient stars that never sleep.", "It passed through me, a nameless tone,\na violin with strings unknown.\nAnd for one breath, the clocks stood still,\nthe stars forgot their distant will.", "§Outro", "The questions faded into night,\nno longer searching for the light.", "And then I knew, beyond all doubt,\nsome truths are lived, not figured out.", "Some secrets need no key to turn,\nno final answer left to learn.", "For love asks neither proof nor art,\nbut just the courage of the heart.", "And what no words can ever prove,\nthe soul may recognize as love.", "§End"],sync:[24.0,24.0,28.0,31.9,36.5,40.3,40.3,44.3,49.0,52.9,57.1,57.1,60.6,64.3,68.1,71.9,71.9,76.1,80.7,84.9,88.4,88.4,91.1,94.4,98.3,102.1,106.0,106.0,109.3,113.8,118.3,12   audio:{root:43,scale:[0,1,3,5,7,8,10],step:.66,pad:[0,7,12,17],cut:520,wind:.8,spark:.25,oct:[12,12,19,24]},lyrics:["§Verse 1", "Before the silence learned its name,\nBefore the stars became a flame,\nWas there a note no ear could hear,\nA distant song that drew us near?", "Before the wind began to cry,\nBefore the moon embraced the sky,\nDid something tremble in the deep,\nBefore the universe could sleep?", "§Pre-Chorus", "If silence is the end of sound,\nWhat was there before the first was found?\nAnd if no voice had learned to sing,\nWho heard the birth of everything?", "§Chorus", "What was the sound before silence?\nA heartbeat without a heart?\nA whisper beyond existence,\nBefore the worlds could start?", "What was the sound before silence?\nA note that never flew?\nOr was the first vibration\nA question breaking through?", "§Verse 2", "I pressed my ear against the night,\nAnd listened past the fading light.\nNo words, no footsteps, no refrain,\nJust something I could not explain.", "I asked the darkness: Do you know\nWhere all the unheard echoes go?\nIt held my question like a stone,\nThen left me listening alone.", "§Chorus", "What was the sound before silence?\nA heartbeat without a heart?\nA whisper beyond existence,\nBefore the worlds could start?", "What was the sound before silence?\nA note that never flew?\nOr was the first vibration\nA question breaking through?", "§Bridge", "Perhaps the silence never came,\nPerhaps we only gave it a name.\nPerhaps beneath the quiet sea,\nA thousand sounds are waiting free.", "And if the last note fades away,\nDoes silence have the final say?\nOr does the echo still remain,\nBeyond the reach of joy and pain?", "§Final Chorus", "What was the sound before silence?\nWho listened to the first?\nWas it a song of creation,\nOr the universe's thirst?", "What was the sound before silence?\nAnd when the stars are through,\nWill silence be the final sound,\nOr will a song begin anew?", "§Outro", "— Universe, can silence hear?", "— I don't know.", "— Then why does it feel so near?", "§End"],sync:[19.4,19.4,25.9,31.9,38.3,44.4,50.0,56.1,62.4,68.4,68.4,74.2,81.5,88.0,94.3,94.3,100.5,106.0,111.3,117.0,123.3,128.1,133.3,138.8,138.8,145.1,151.5,157.9,164.3,170.4,176.4,182.5,188.1,188.1,194.3,199.8,205.2,210.9,217.1,221.9,227.1,232.6,232.6,238.5,244.3,250.1,256.4,262.4,268.4,274.1,280.3,280.3,286.5,291.7,296.9,302.0,308.2,314.1,320.1,325.3,325.3,330.9,334.7,340.6]},

  audio:{root:52,scale:[0,1,4,5,7,8,10],step:.36,pad:[0,7,13,16],cut:900,wind:.45,spark:.4,oct:[12,15,19,24]},lyrics:["§Verse 1", "If love has no answer,\nThen what is passion?\nA fire without a reason,\nA flame beyond compassion?", "Is it the thunder in the rain,\nThe pleasure dancing through the pain?\nA silent spark beneath the skin,\nOr something burning deep within?", "§Verse 2", "I asked the stars: Who lit this fire?\nWho gave a silent heart desire?\nWhy does a melody remain\nWhen every word has lost its name?", "Why does a violin still cry\nWhen no one hears its last goodbye?\nWhy does the artist paint the night\nAnd turn the darkness into light?", "§Pre-Chorus", "Is passion born from what we miss,\nOr from the things we can't resist?\nAnd if the flame consumes the night,\nWho teaches darkness how to shine?", "§Chorus", "If love has no answer,\nWhat is passion then?\nA fire that keeps on burning\nAgain and again?", "Is it the pulse of creation,\nThe courage to begin?\nA universe awakening\nBeneath our fragile skin?"],sync:[12.3,12.3,18.5,24.4,30.9,37.8,45.3,54.1,62.0,70.0,70.0,78.7,86.4,92.9,101.1,108.1,116.5,124.8,132.8,132.8,141.0,149.4,157.9,166.1,166.1,172.3,178.3,185.4,190.6,197.7,203.7,209.5]},

  audio:{root:46,scale:[0,2,4,6,8,10],step:.55,pad:[0,6,12,18],cut:600,wind:.7,spark:.3,oct:[12,18,24,24]},lyrics:["§Instrumental Intro", "§Verse 1", "I watched the shadows cross the wall,\nThe evening came without a call.\nA thousand moments slipped away,\nBut something in me made them stay.", "I held a photograph tonight,\nA face still living in the light.\nThe years had changed the world I knew,\nBut not the eyes that once looked through.", "§Pre-Chorus", "If yesterday has disappeared,\nWhy is its voice still standing here?\nAnd if tomorrow isn't born,\nWhy do I wait for every dawn?", "§Chorus", "Where does time go\nWhen the moment disappears?\nDoes it travel through the stars,\nOr hide inside our tears?", "Where does time go\nWhen the clocks forget to chime?\nAre we moving through the universe,\nOr is the universe moving through time?", "§Verse 2", "I asked the river where it ran,\nIt answered in a language older than man.\nI asked the stars how long they'd stay,\nThey burned without a word to say.", "The hands keep turning on the clock,\nYet memories refuse to stop.\nA single second, long ago,\nCan hold a life we'll never know.", "§Pre-Chorus", "If time is only what we count,\nWhy can't we measure what we've found?\nAnd if the past is truly gone,\nWhat keeps its music playing on?", "§Chorus", "Where does time go\nWhen the moment disappears?\nDoes it travel through the stars,\nOr hide inside our tears?", "Where does time go\nWhen the clocks forget to chime?\nAre we moving through the universe,\nOr is the universe moving through time?", "§Instrumental Break", "§Bridge", "Perhaps the past is not a place,\nBut something written in a face.\nPerhaps tomorrow has no door,\nUntil we take one step once more.", "And what if time does not depart,\nBut leaves its fingerprints upon the heart?\nIf every moment has its own eternity,\nWhy does it feel like it's escaping me?", "§Final Chorus", "Where does time go\nWhen the final hour appears?\nDoes it vanish into darkness,\nOr return across the years?", "Where does time go\nBeyond the last remembered rhyme?\nAre we passing through existence,\nOr is existence passing through time?", "§Outro", "— Universe, where does time go?", "— Perhaps it never leaves.", "— Then why do we?", "§End"],sync:[54.2,54.2,54.2,60.3,65.9,71.4,77.3,82.3,88.0,94.4,101.1,101.1,106.3,112.4,117.4,122.5,122.5,126.4,131.3,137.0,141.7,145.5,151.1,157.0,163.3,163.3,168.7,175.4,181.7,187.5,193.5,198.6,203.4,209.1,209.1,214.4,220.6,225.9,231.4,231.4,235.3,240.2,245.9,250.6,254.4,260.0,265.9,272.2,272.2,272.2,277.8,283.3,288.5,294.1,299.8,306.7,312.8,319.2,319.2,323.0,328.1,333.3,338.2,342.0,347.7,353.4,359.5,359.5,364.9,369.7,373.5]},

/* ---------- starfield ---------- */
(function(){
  const cv=document.getElementById("stars"),ctx=cv.getContext("2d");
  let w,h,stars=[],meteors=[],nextMeteor=performance.now()+6000;
  const dpr=Math.min(devicePixelRatio||1,2);
  function seed(){
    const r=cv.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);
    cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.min(260,(w*h/5200)|0)},()=>({
      x:Math.random()*w,y:Math.random()*h,r:.3+Math.random()*1.25,b:.25+Math.random()*.55,
      s:.4+Math.random()*1.6,p:Math.random()*6.28,u:Math.random()}));
  }
  seed();addEventListener("resize",seed);
  (function draw(now){
    ctx.clearRect(0,0,w,h);const t=now/1000;
    for(const s of stars){
      const a=Math.max(.05,s.b+.45*Math.sin(t*s.s+s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);
      ctx.fillStyle=s.u>.82?`rgba(190,225,255,${a})`:s.u>.62?`rgba(255,230,190,${a})`:`rgba(235,240,255,${a})`;
      ctx.fill();
      if(s.r>1.15){ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.6,0,6.28);ctx.fillStyle=`rgba(200,220,255,${a*.08})`;ctx.fill();}
    }
    if(now>nextMeteor){const L=Math.random()>.5;
      meteors.push({x:L?-30:w+30,y:Math.random()*h*.5,vx:(L?1:-1)*(5+Math.random()*4),vy:1.6+Math.random()*1.6,l:0,m:70+Math.random()*40});
      nextMeteor=now+9000+Math.random()*14000;}
    meteors=meteors.filter(m=>m.l<m.m);
    for(const m of meteors){m.x+=m.vx;m.y+=m.vy;m.l++;const f=1-m.l/m.m;
      const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*12,m.y-m.vy*12);
      g.addColorStop(0,`rgba(255,244,214,${.8*f})`);g.addColorStop(1,"rgba(255,244,214,0)");
      ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*12,m.y-m.vy*12);ctx.stroke();}
    requestAnimationFrame(draw);
  })(performance.now());
})();

    an.setAttribute("values",".5;1;.5");an.setAttribute("dur",(2.6+((x|0)%3))+"s");an.setAttribute("repeatCount","indefinite");
    g.appendChild(an);nodes.appendChild(g);
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",.55*s);c.setAttribute("fill","#dffbff");
    c.setAttribute("filter","url(#softGlow)");nodes.appendChild(c);
  }
  window.setActiveLines=(idx)=>{
    for(const ln of links.querySelectorAll("line[data-pair]")){
      const[a,b]=ln.dataset.pair.split(",").map(Number);
      const act=a===idx||b===idx;
      ln.setAttribute("stroke-width",act?.9:.5);ln.setAttribute("opacity",act?.9:.4);
    }
  };
})();

/* ---------- covers ---------- */
const coverEls=[];
(function(){
  const wrap=document.getElementById("covers");
  TRACKS.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="cover";d.style.left=t.pos.x+"%";d.style.top=t.pos.y+"%";
    d.style.animationDuration=(7+i%4)+"s";d.style.animationDelay=(i*.7)+"s";
    const shift=t.label??(t.pos.x<16?-30:t.pos.x>84?-70:-50);
    d.innerHTML=`<button aria-label="Play ${t.title.replace(/"/g,"&quot;")}" aria-pressed="false">
      <span class="halo"></span><span class="spinring"></span>
      <span class="frame"><img src="${t.cover}" alt="${t.title} — cover artwork" draggable="false"></span>
      <span class="spk top">✦</span><span class="spk bot">✦</span><span class="pulse"></span>
    </button>
    <div class="clabel" style="transform:translateX(${shift}%)">${t.title}</div>`;
    wrap.appendChild(d);coverEls.push(d);
    d.querySelector("button").addEventListener("click",()=>i===cur?engine.toggle():select(i,true));
  });
})();

/* ---------- procedural audio engine ---------- */
const hz=m=>440*Math.pow(2,(m-69)/12);
const engine={
  ctx:null,master:null,wet:null,dry:null,voices:[],timer:null,nextT:0,step:0,cfg:null,
  mode:"procedural",el:null,dur:0,offset:0,startWall:0,playing:false,vol:.8,muted:false,
  probeCache:{},id:null,
  ensure(){
    if(this.ctx)return this.ctx;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    this.ctx=new AC();
    this.master=this.ctx.createGain();this.master.gain.value=0;
    const comp=this.ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;
    this.master.connect(comp);comp.connect(this.ctx.destination);
    const conv=this.ctx.createConvolver();
    const rate=this.ctx.sampleRate,len=(3.4*rate)|0,buf=this.ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*.5;}
    conv.buffer=buf;
    this.wet=this.ctx.createGain();this.wet.gain.value=.9;this.dry=this.ctx.createGain();this.dry.gain.value=.85;
    this.dry.connect(this.master);this.wet.connect(conv);conv.connect(this.master);
    return this.ctx;
  },
  route(n,wl){const w=this.ctx.createGain();w.gain.value=wl;n.connect(this.dry);n.connect(w);w.connect(this.wet);},
  async probe(id){
    if(id in this.probeCache)return this.probeCache[id];
    const emb=(window.NOXIS_AUDIO||{})[id];
    if(emb){try{
      const bin=atob(emb),n=bin.length,u8=new Uint8Array(n);
      for(let i=0;i<n;i++)u8[i]=bin.charCodeAt(i);
      return this.probeCache[id]=URL.createObjectURL(new Blob([u8],{type:"audio/mp4"}));
    }catch(e){}}
    for(const ext of PROBE_EXTS){
      try{const r=await fetch(`audio/${id}.${ext}`,{method:"HEAD"});if(r.ok)return this.probeCache[id]=`audio/${id}.${ext}`;}catch(e){}
    }
    return this.probeCache[id]=null;
  },
  async load(track,autoplay){
    this.stopProc();if(this.el){this.el.pause();this.el.src="";this.el=null;}
    this.id=track.id;this.offset=0;this.dur=track.dur;
    const url=await this.probe(track.id);
    if(this.id!==track.id)return;
    if(url){
      this.mode="file";
      const el=new Audio(url);el.volume=Math.pow(this.effVol(),1.6);
      el.addEventListener("ended",()=>{this.playing=false;ui.playing(false);advance(1,true);});
      el.addEventListener("loadedmetadata",()=>{if(isFinite(el.duration)&&el.duration>0){this.dur=el.duration;ui.time(this.getTime(),this.dur);}});
      this.el=el;
      document.getElementById("pMode").style.display="inline";
    }else{this.mode="procedural";this.cfg=track.audio;document.getElementById("pMode").style.display="none";}
    if(autoplay)await this.play();else ui.time(0,this.dur);
  },
  effVol(){return this.muted?0:this.vol;},
  fade(target,sec){const g=this.master.gain,t=this.ctx.currentTime;
    g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(target,t+sec);},
  async play(){
    if(!this.id)return;const ctx=this.ensure();if(!ctx)return;
    if(ctx.state==="suspended")await ctx.resume();
    if(this.mode==="file"&&this.el){try{await this.el.play();}catch(e){return;}}
    else this.startProc();
    this.playing=true;this.startWall=performance.now()/1000;
    this.fade(Math.pow(this.effVol(),1.6),1.1);ui.playing(true);
  },
  pause(){
    if(!this.playing)return;
    this.offset+=performance.now()/1000-this.startWall;this.playing=false;
    if(this.mode==="file"&&this.el)this.el.pause();else this.stopVoices();
    this.fade(0,.45);ui.playing(false);
  },
  async toggle(){this.playing?this.pause():await this.play();},
  seek(t){
    t=Math.max(0,Math.min(t,this.dur));
    if(this.mode==="file"&&this.el){try{this.el.currentTime=t;}catch(e){}}
    this.offset=t;if(this.playing)this.startWall=performance.now()/1000;
    ui.time(t,this.dur);
  },
  setVol(){if(this.mode==="file"&&this.el)this.el.volume=Math.pow(this.effVol(),1.6);
    if(this.playing)this.fade(Math.pow(this.effVol(),1.6),.12);ui.vol();},
  getTime(){let t=this.offset;if(this.playing)t+=performance.now()/1000-this.startWall;
    if(this.mode==="file"&&this.el)t=this.el.currentTime;return Math.min(t,this.dur);},
  startProc(){
    if(!this.ctx||!this.cfg)return;this.stopVoices();this.buildPad();this.buildWind();
    this.nextT=this.ctx.currentTime+.12;this.step=Math.floor(this.offset/this.cfg.step);
    if(this.timer===null)this.timer=setInterval(()=>this.tick(),110);
  },
  stopVoices(){const t=this.ctx?this.ctx.currentTime:0;
    for(const v of this.voices){try{v(t);}catch(e){}}this.voices=[];},
  stopProc(){if(this.timer!==null){clearInterval(this.timer);this.timer=null;}this.stopVoices();},
  buildPad(){
    const c=this.ctx,t0=c.currentTime,cfg=this.cfg;
    const out=c.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.055,t0+4);
    const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=cfg.cut;f.Q.value=.8;
    out.connect(f);this.route(f,.35);
    const lfo=c.createOscillator();lfo.frequency.value=.05;
    const lg=c.createGain();lg.gain.value=cfg.cut*.4;lfo.connect(lg);lg.connect(f.frequency);lfo.start(t0);
    this.voices.push(t=>lfo.stop(t));
    const oscs=[];
    for(const iv of cfg.pad)for(const det of[-4,4]){
      const o=c.createOscillator();o.type="triangle";o.frequency.value=hz(cfg.root+iv);o.detune.value=det;
      const g=c.createGain();g.gain.value=.16/cfg.pad.length;o.connect(g);g.connect(out);o.start(t0);
      oscs.push(o);this.voices.push(t=>o.stop(t));
    }
    this.voices.push(()=>{out.gain.cancelScheduledValues(c.currentTime);
      out.gain.setValueAtTime(out.gain.value,c.currentTime);out.gain.linearRampToValueAtTime(0,c.currentTime+.4);
      setTimeout(()=>{try{oscs.forEach(o=>o.stop());}catch(e){}},500);});
  },
  buildWind(){
    const c=this.ctx,cfg=this.cfg;if(cfg.wind<=0)return;const t0=c.currentTime;
    const len=2*c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=420;bp.Q.value=.5;
    const g=c.createGain();g.gain.value=.012*cfg.wind;
    const lfo=c.createOscillator();lfo.frequency.value=.04;
    const lg=c.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);
    src.connect(bp);bp.connect(g);this.route(g,.6);src.start(t0);lfo.start(t0);
    this.voices.push(()=>{try{src.stop();lfo.stop();}catch(e){}});
  },
  tick(){
    if(!this.ctx||!this.cfg||!this.playing||this.mode!=="procedural")return;
    const ahead=this.ctx.currentTime+.55,cfg=this.cfg;
    while(this.nextT<ahead){
      this.arp(this.nextT,this.step,cfg);
      if(this.step%16===0&&Math.random()<cfg.spark)this.sparkle(this.nextT+cfg.step*.5,cfg);
      if(this.step%64===0)this.sub(this.nextT,cfg);
      this.step++;this.nextT+=cfg.step;
    }
    if(this.getTime()>=this.dur){this.playing=false;this.stopVoices();this.fade(0,.6);ui.playing(false);advance(1,true);}
  },
  arp(t,step,cfg){
    const c=this.ctx,oct=cfg.oct[step%cfg.oct.length];
    const deg=cfg.scale[Math.floor((step*.7+Math.sin(step*1.7)*1.4+cfg.scale.length*4)%cfg.scale.length)];
    const o=c.createOscillator();o.type=step%4===0?"sine":"triangle";o.frequency.value=hz(cfg.root+oct+deg);
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.05+(step%8===0?.02:0),t+.02);
    g.gain.exponentialRampToValueAtTime(.0004,t+Math.max(1.2,cfg.step*2.6));
    o.connect(g);
    if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=step%2===0?-.35:.35;g.connect(p);this.route(p,.85);}
    else this.route(g,.85);
    o.start(t);o.stop(t+Math.max(1.4,cfg.step*2.8)+.1);
  },
  sparkle(t,cfg){
    const c=this.ctx,deg=cfg.scale[(Math.random()*cfg.scale.length)|0];
    const o=c.createOscillator();o.type="sine";o.frequency.value=hz(cfg.root+24+deg+(Math.random()<.3?12:0));
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.028,t+.015);
    g.gain.exponentialRampToValueAtTime(.0003,t+.9);
    o.connect(g);this.route(g,1.2);o.start(t);o.stop(t+1);
  },
  sub(t,cfg){
    const c=this.ctx,o=c.createOscillator();o.type="sine";o.frequency.value=hz(cfg.root-12);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.6);
    g.gain.linearRampToValueAtTime(.0001,t+6);
    o.connect(g);this.route(g,.2);o.start(t);o.stop(t+6.2);
  }
};

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const fmt=s=>{if(!isFinite(s)||s<0)s=0;return (s/60|0)+":"+String(s%60|0).padStart(2,"0");};
let cur=DEFAULT_I;
const ui={
  playing(p){
    $("iconPlay").style.display=p?"none":"block";
    $("iconPause").style.display=p?"block":"none";
    $("playBtn").setAttribute("aria-label",p?"Pause":"Play");
    coverEls.forEach((el,i)=>el.classList.toggle("playing",p&&i===cur));
    $("pOrb").classList.toggle("play",p);$("lCov").classList.toggle("play",p);
  },
  time(t,d){
    $("pTime").textContent=fmt(t);$("pDur").textContent=fmt(d);
    const pct=d>0?t/d*100:0;
    $("seekFill").style.width=pct+"%";$("seekThumb").style.left=pct+"%";
  },
  vol(){
    const v=engine.effVol();
    $("volRange").value=v;
    $("volRange").style.background=`linear-gradient(90deg,#ffd98a ${v*100}%,#26386b ${v*100}%)`;
    $("muteBtn").setAttribute("aria-label",v===0?"Unmute":"Mute");
    $("muteBtnMobile").setAttribute("aria-label",v===0?"Unmute":"Mute");
  },
  select(){
    coverEls.forEach((el,i)=>{
      el.classList.toggle("sel",i===cur);
      el.querySelector("button").setAttribute("aria-pressed",i===cur);
    });
    $("pTitle").textContent=TRACKS[cur].title;
    $("pOrbImg").src=TRACKS[cur].cover;
    ui.time(0,TRACKS[cur].dur);
    window.setActiveLines(cur);
  }
};
function advance(dir,auto){const wasPlaying=engine.playing;select((cur+dir+TRACKS.length)%TRACKS.length,auto||wasPlaying);}
async function select(i,autoplay){
  cur=i;ui.select();setLyricsTrack(TRACKS[i]);
  await engine.load(TRACKS[i],autoplay);
}
$("playBtn").addEventListener("click",async()=>{
  if(!engine.id||(!engine.playing&&engine.getTime()===0)){await engine.load(TRACKS[cur],true);}
  else await engine.toggle();
});
$("prevBtn").addEventListener("click",()=>advance(-1));
$("nextBtn").addEventListener("click",()=>advance(1));
/* seek */
const seek=$("seek");let dragging=false;
const posToTime=x=>{const r=seek.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))*engine.dur;};
seek.addEventListener("pointerdown",e=>{dragging=true;seek.setPointerCapture(e.pointerId);
  $("seekThumb").style.opacity=1;ui.time(posToTime(e.clientX),engine.dur);});
seek.addEventListener("pointermove",e=>{if(dragging)ui.time(posToTime(e.clientX),engine.dur);});
seek.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;$("seekThumb").style.opacity=0;engine.seek(posToTime(e.clientX));});
seek.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")engine.seek(engine.getTime()+5);
  if(e.key==="ArrowLeft")engine.seek(engine.getTime()-5);
});
/* volume */
$("volRange").addEventListener("input",e=>{engine.vol=+e.target.value;engine.muted=engine.vol===0;engine.setVol();});
function toggleMute(){engine.muted=!engine.muted;if(!engine.muted&&engine.vol===0)engine.vol=.6;engine.setVol();}
$("muteBtn").addEventListener("click",toggleMute);
$("muteBtnMobile").addEventListener("click",toggleMute);
/* lyrics */
function setLyricsTrack(t){
  $("lTitle").textContent=t.title;
  $("lCovImg").src=t.cover;
  renderLyrics(t);
}
$("lyricsBtn").addEventListener("click",()=>$("lyrics").classList.add("open"));
$("lyricsClose").addEventListener("click",()=>$("lyrics").classList.remove("open"));
$("lyrics").addEventListener("click",e=>{if(e.target.id==="lyrics")$("lyrics").classList.remove("open");});
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if($("lyrics").classList.contains("open")&&e.key==="Escape"){$("lyrics").classList.remove("open");return;}
  if(e.code==="Space"){e.preventDefault();if(!engine.id)engine.load(TRACKS[cur],true);else engine.toggle();}
  else if(e.code==="ArrowRight"&&e.altKey)advance(1);
  else if(e.code==="ArrowLeft"&&e.altKey)advance(-1);
});
/* immersive */
$("closeBtn").addEventListener("click",()=>{
  const page=$("page");page.classList.toggle("immersive");
  const im=page.classList.contains("immersive");
  $("closeBtn").textContent=im?"✦":"✕";
  $("closeBtn").setAttribute("aria-label",im?"Show interface":"Immersive view");
});
/* time poller */
setInterval(()=>{if(engine.playing)ui.time(engine.getTime(),engine.dur);if(engine.id&&window.lyricsTick)window.lyricsTick(engine.getTime());},180);
/* init */
ui.select();ui.vol();setLyricsTrack(TRACKS[cur]);
</script>

<script>/* built-in original songs (base64) */
window.NOXIS_AUDIO={};</script>
