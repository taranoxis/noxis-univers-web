<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NOXIS CREATE — The Creative Universe. An explorable universe of AI generators: images, music, video, voice, avatars, text, apps, 3D worlds, AI models and local AI cores.">
<title>NOXIS ✳ CREATE — The Creative Universe</title>
<link rel="icon" href="../noxis-favicon.svg" type="image/svg+xml">
<style>
  :root{
    --gold:#f5c451; --gold-soft:rgba(245,196,81,.55);
    --cyan:#58c8ff; --violet:#b07cff; --ink:#03040c;
    --panel-bg1:rgba(8,11,28,.97); --panel-bg2:rgba(4,6,17,.985);
    --line:rgba(140,170,255,.14); --text:#dfe6ff; --muted:#9aa7cc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 120% at 50% 0%, #070b1e 0%, var(--ink) 55%, #010208 100%);
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--text); overflow-x:hidden;
  }
  /* ---------- STAGE : the approved artwork, untouched ---------- */
  .stage{
    position:relative;
    aspect-ratio:1671/941;
    width:min(100vw, calc(100dvh * (1671 / 941)));
    max-height:100dvh;
    border-radius:6px;
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    overflow:hidden;
    background:#05070f;
  }
  .stage>img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
  /* ---------- HOTSPOTS ---------- */
  .hotspot{
    position:absolute; padding:0; margin:0;
    background:transparent; border:0; border-radius:16px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    outline:none; font:inherit;
  }
  .hotspot::before{
    content:""; position:absolute; inset:6%;
    border-radius:16px; border:1px solid transparent;
    background:radial-gradient(ellipse at 50% 45%, rgba(140,190,255,.14), rgba(255,215,150,.05) 55%, transparent 75%);
    box-shadow:0 0 0 1px transparent, 0 0 26px transparent, inset 0 0 30px transparent;
    opacity:0; transition:opacity .35s ease, box-shadow .35s ease;
    pointer-events:none;
  }
  .hotspot:hover::before, .hotspot:focus-visible::before, .hotspot.reveal::before{
    opacity:1;
    border-color:rgba(255,215,150,.5);
    box-shadow:0 0 26px rgba(130,180,255,.4), inset 0 0 34px rgba(255,205,130,.16);
  }
  .hotspot:focus-visible{outline:2px solid rgba(255,225,160,.9); outline-offset:2px}
  .hotspot .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* ---------- HINT / TOGGLE (live outside the artwork) ---------- */
  #hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font-size:clamp(11px,1.6vw,13px); letter-spacing:.14em; text-transform:uppercase;
    color:rgba(214,226,255,.8); text-shadow:0 0 14px rgba(90,140,255,.8);
    pointer-events:none; transition:opacity 1s ease; white-space:nowrap;
  }
  #hint.gone{opacity:0}
  #skyToggle{
    position:fixed; top:12px; right:12px; z-index:40;
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(6,9,22,.72); color:#e8ddc0;
    border:1px solid rgba(245,196,81,.35); border-radius:999px;
    padding:7px 14px; font-size:12px; letter-spacing:.08em; cursor:pointer;
    backdrop-filter:blur(6px); transition:border-color .3s, color .3s;
  }
  .portal-return{
    position:fixed; top:12px; left:12px; z-index:40;
    padding:7px 14px; border:1px solid rgba(245,196,81,.35); border-radius:999px;
    background:rgba(6,9,22,.85); color:#ffe9b8; text-decoration:none; font-size:13px;
  }
  .portal-return:focus-visible{outline:2px solid #f5c451; outline-offset:3px}
  #skyToggle:hover{border-color:rgba(245,196,81,.8)}
  #skyToggle[aria-pressed="true"]{color:#ffe9b8; border-color:rgba(245,196,81,.9); box-shadow:0 0 18px rgba(245,196,81,.25)}
  #fx{position:absolute; inset:0; pointer-events:none; z-index:3}
  /* ---------- PANEL ---------- */
  #panel{position:fixed; inset:0; z-index:60; visibility:hidden}
  #panel.open{visibility:visible}
  #backdrop{position:absolute; inset:0; background:rgba(2,4,12,.62); opacity:0; transition:opacity .4s ease; backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px)}
  #panel.open #backdrop{opacity:1}
  .sheet{
    position:absolute; top:0; right:0; height:100%;
    width:min(620px,100%);
    background:linear-gradient(180deg,var(--panel-bg1),var(--panel-bg2));
    border-left:1px solid rgba(245,196,81,.22);
    box-shadow:-40px 0 90px rgba(0,0,0,.65);
    transform:translateX(103%); transition:transform .5s cubic-bezier(.22,.9,.28,1);
    display:flex; flex-direction:column;
  }
  #panel.open .sheet{transform:translateX(0)}
  .sheet-head{
    display:flex; align-items:center; gap:14px;
    padding:18px 22px 14px;
    border-bottom:1px solid rgba(245,196,81,.2);
    background:linear-gradient(180deg, rgba(30,24,10,.35), transparent);
  }
  .glyph{
    font-size:26px; width:52px; height:52px; flex:0 0 52px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid rgba(140,180,255,.35);
    background:radial-gradient(circle at 35% 30%, rgba(120,160,255,.25), rgba(10,14,34,.6));
    box-shadow:0 0 22px rgba(110,150,255,.28);
  }
  .sheet-head h2{
    margin:0; font-size:clamp(18px,2.6vw,24px); letter-spacing:.1em;
    font-family:"Palatino Linotype","Book Antiqua",Georgia,serif; color:#ffe9b8;
    text-shadow:0 0 18px rgba(245,196,81,.35);
  }
  .sheet-head .sub{font-size:12px; color:var(--muted); letter-spacing:.12em; margin-top:3px}
  #closeBtn{
    margin-left:auto; flex:0 0 auto; width:44px; height:44px; border-radius:50%;
    background:rgba(10,14,32,.8); color:#ffd98a; font-size:20px;
    border:1px solid rgba(255,205,130,.4); cursor:pointer;
    transition:transform .25s, box-shadow .25s;
  }
  #closeBtn:hover,#closeBtn:focus-visible{transform:rotate(90deg); box-shadow:0 0 18px rgba(255,205,130,.35); outline:none}
  .sheet-body{flex:1; overflow-y:auto; padding:18px 24px 34px; scrollbar-width:thin; scrollbar-color:rgba(140,170,255,.35) transparent}
  .sheet-body::-webkit-scrollbar{width:8px}
  .sheet-body::-webkit-scrollbar-thumb{background:rgba(140,170,255,.3); border-radius:8px}
  .blurb{color:#c9d4f2; line-height:1.65; font-size:14.5px; margin:6px 0 18px}
  .kicker{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; opacity:.85}
  /* ---------- PROGRAM ENTRIES ---------- */
  .prog{padding:14px 2px 4px}
  /* flowing light-ribbon divider — echoes the artwork's swirls */
  .prog::after{
    content:""; display:block; height:14px; margin-top:10px;
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'120'%20height%3D'14'%20viewBox%3D'0%200%20120%2014'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20x2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%23f5c451'%2F%3E%3Cstop%20offset%3D'.55'%20stop-color%3D'%23b07cff'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%2358c8ff'%2F%3E%3C%2FlinearGradient%3E%3Cfilter%20id%3D'b'%20x%3D'-0.3'%20y%3D'-1.5'%20width%3D'1.6'%20height%3D'4'%3E%3CfeGaussianBlur%20stdDeviation%3D'1.8'%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpath%20d%3D'M0%208%20Q15%202%2030%208%20T60%208%20T90%208%20T120%208'%20fill%3D'none'%20stroke%3D'%23f5c451'%20stroke-width%3D'3.4'%20opacity%3D'.22'%20filter%3D'url(%23b)'%20stroke-linecap%3D'round'%2F%3E%3Cpath%20d%3D'M0%208%20Q15%202%2030%208%20T60%208%20T90%208%20T120%208'%20fill%3D'none'%20stroke%3D'url(%23g)'%20stroke-width%3D'1.2'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E") repeat-x left center / 120px 14px;
    opacity:.9;
    animation:flow 16s linear infinite;
  }
  .prog:last-child::after{content:none}
  @keyframes flow{from{background-position-x:0}to{background-position-x:120px}}
  .prog h3{margin:0 0 6px; font-size:17px; letter-spacing:.03em}
  .prog h3 a{color:#8fd0ff; text-decoration:none; border-bottom:1px dotted rgba(120,190,255,.5); transition:color .25s, border-color .25s}
  .prog h3 a:hover,.prog h3 a:focus-visible{color:#ffd98a; border-color:rgba(255,205,130,.7); outline:none}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
  .chip{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:1px solid; white-space:nowrap}
  .c-online{color:#7cd7ff; border-color:rgba(124,215,255,.5); background:rgba(124,215,255,.08)}
  .c-local{color:#71e2a4; border-color:rgba(113,226,164,.5); background:rgba(113,226,164,.08)}
  .c-both{color:#c9a2ff; border-color:rgba(201,162,255,.5); background:rgba(201,162,255,.08)}
  .c-free{color:#7ee2a8; border-color:rgba(126,226,168,.55); background:rgba(126,226,168,.08)}
  .c-freemium{color:#ffd98a; border-color:rgba(255,217,138,.55); background:rgba(255,217,138,.08)}
  .c-paid{color:#ff9db0; border-color:rgba(255,157,176,.5); background:rgba(255,157,176,.08)}
  .c-oss{color:#a8ffdf; border-color:rgba(168,255,223,.5); background:rgba(168,255,223,.07)}
  .prog p{margin:0 0 8px; line-height:1.6; font-size:14px; color:#c9d4f2}
  .prog .req{font-size:12.5px; color:var(--muted); margin-top:8px; padding-left:10px; border-left:2px solid rgba(245,196,81,.4)}
  .prog .req b{color:#e8ddc0; font-weight:600}
  /* ---------- OLLAMA / FAMILIES ---------- */
  code.cmd{
    display:block; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; color:#bfe3ff; background:rgba(9,13,30,.85);
    border:1px solid rgba(120,160,255,.25); border-radius:10px;
    padding:12px 14px; margin:8px 0 14px; overflow-x:auto; white-space:pre;
  }
  .kw{color:#ffd98a}
  details.family{
    border:1px solid rgba(140,170,255,.2); border-radius:12px;
    background:rgba(16,22,48,.55); margin:0 0 10px; overflow:hidden;
  }
  details.family summary{
    list-style:none; cursor:pointer; padding:13px 16px;
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    transition:background .25s;
  }
  details.family summary::-webkit-details-marker{display:none}
  details.family summary:hover,details.family summary:focus-visible{background:rgba(120,160,255,.08); outline:none}
  details.family .fam{font-size:15.5px; color:#ffe9b8; letter-spacing:.04em; font-weight:600}
  details.family .org{font-size:12px; color:var(--muted)}
  details.family .cnt{margin-left:auto; font-size:10.5px; letter-spacing:.1em; color:#8fd0ff; border:1px solid rgba(124,215,255,.4); border-radius:999px; padding:2px 9px}
  details.family[open] summary{border-bottom:1px solid rgba(140,170,255,.18); background:rgba(120,160,255,.06)}
  details.family summary::after{content:"+"; color:#ffd98a; font-size:16px}
  details.family[open] summary::after{content:"–"}
  .fam-body{padding:12px 16px 14px; font-size:13.5px; color:#c9d4f2; line-height:1.6}
  .models{display:flex; flex-wrap:wrap; gap:7px; margin:9px 0 4px}
  .model{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    color:#bfe3ff; border:1px solid rgba(120,160,255,.3); border-radius:8px;
    padding:3px 9px; background:rgba(14,20,44,.7);
    text-decoration:none; transition:border-color .2s, color .2s;
  }
  a.model:hover,a.model:focus-visible{border-color:rgba(255,205,130,.7); color:#ffd98a; outline:none}
  .note{font-size:12.5px; color:var(--muted); line-height:1.55; padding:10px 12px; border:1px dashed rgba(245,196,81,.35); border-radius:10px; margin-top:16px}
  .foot{margin-top:20px; font-size:11.5px; color:rgba(154,167,204,.75); line-height:1.5}
  .foot a{color:#8fd0ff; text-decoration:none}
  /* breadcrumb inside panel */
  .crumbs{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 14px}
  .crumbs button{
    background:rgba(16,22,48,.6); border:1px solid rgba(140,170,255,.25); color:#8fd0ff;
    font-size:11px; letter-spacing:.08em; border-radius:999px; padding:5px 12px; cursor:pointer;
  }
  .crumbs button:hover{border-color:rgba(255,205,130,.6); color:#ffd98a}
  @media (max-width:640px){
    .sheet{width:100%; border-left:0}
    .sheet-body{padding:14px 16px 30px}
    #hint{bottom:8px}
  }
  .h-rot{display:none}
  @media (orientation:portrait) and (max-width:640px){
    .h-any{display:none}
    .h-rot{display:inline}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important; animation:none!important}
    #fx{display:none}
  }
/* NOXIS mobile responsive v1 */
.create-mobile-nav{display:none}
@media(max-width:1024px),(hover:none) and (pointer:coarse) and (max-width:1366px){
body{justify-content:flex-start;padding-top:64px;padding-bottom:24px}
.stage{width:100%;max-height:none;flex-shrink:0}
.stage .hotspot{visibility:hidden}
#hint{display:none}
.portal-return,#skyToggle{min-height:44px;display:inline-flex;align-items:center;max-width:48%;white-space:normal}
.create-mobile-nav{display:block;width:min(100%,900px);padding:16px}
.create-mobile-nav h2{color:var(--gold);text-align:center;font-size:1.3rem}
.create-mobile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.create-mobile-grid button{min-height:56px;padding:12px;border:1px solid var(--gold-soft);border-radius:12px;background:#10182d;color:var(--text);font:600 16px/1.4 system-ui;overflow-wrap:anywhere;cursor:pointer}
.create-mobile-grid button:focus-visible{outline:2px solid var(--gold)}
.sheet{width:min(100%,720px)}
.sheet-head{padding:12px;gap:8px}
.sheet-head>div{min-width:0;overflow-wrap:anywhere}
.sheet-body{min-height:0;padding:16px;overflow-wrap:anywhere}
}
@media(max-width:420px){.create-mobile-grid{grid-template-columns:1fr}.sheet-head .glyph{display:none}}

</style>
</head>
<body>
<a class="portal-return" href="../#createPortal">Back to NOXIS Univers</a>

<main class="stage" id="stage" aria-label="NOXIS CREATE — The Creative Universe. Select a glowing symbol to open a gallery of AI generators.">
  <img src="universe.webp" alt="NOXIS CREATE — The Creative Universe: a cosmic hall where a robed muse stands before eleven glowing AI generator symbols">
  <canvas id="fx" aria-hidden="true"></canvas>
  <!-- hotspots injected by script -->
</main>

<p id="hint"><span class="h-any">✦ Select a glowing symbol to explore</span><span class="h-rot">✦ Rotate your phone to fill the universe</span></p>
<button id="skyToggle" aria-pressed="false" title="Toggle optional ambient starlight overlay">✦ Living sky: off</button>

<div id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" inert>
  <div id="backdrop"></div>
  <section class="sheet" aria-label="Gallery panel">
    <header class="sheet-head">
      <div class="glyph" id="panelGlyph">✳</div>
      <div>
        <h2 id="panelTitle">NOXIS CREATE</h2>
        <div class="sub" id="panelSub">The Creative Universe</div>
      </div>
      <button id="closeBtn" aria-label="Close gallery and return to the universe">✕</button>
    </header>
    <div class="sheet-body" id="panelBody"></div>
  </section>
</div>

<script>
"use strict";

/* ============================================================

   Extend safely: add objects to PROGRAMS or OLLAMA_FAMILIES,
   or add entries to AI_CORE_EXTRA. No design changes needed.
   Prices / availability verified Nov 2026 — they change often,
   always confirm on the official site.
   ============================================================ */

/* ---- interactive zones on the approved artwork (percent of stage) ---- */
const HOTSPOTS = [

/* ---- Ollama model families (verified against ollama.com/library, Nov 2026) ---- */
const OLLAMA_FAMILIES = [
  { id:"llama", name:"Llama", org:"Meta", about:"The most widely run open-weight family — chat, coding and vision models in every size.",

  { id:"deepseek", name:"DeepSeek", org:"DeepSeek", about:"Strong open reasoning models — R1 reasoning line and V3 chat line.",

    models:[["devstral-small-2","24b coding"],["ministral-3","edge line"],["mistral-small3.2","24b"],["mistral-nemo","12b"],["mixtral","MoE"],["mistral","7b"]] },
  { id:"gpt-oss", name:"GPT-OSS", org:"OpenAI", about:"OpenAI's open-weight models — the first open GPT release, made for local hardware.",

  { id:"glm", name:"GLM", org:"Zhipu AI", about:"Chat and document-understanding models from the GLM line.",
    models:[["glm-4.7-flash","fast chat"],["glm-ocr","document OCR"]] },
  { id:"nemotron", name:"Nemotron", org:"NVIDIA", about:"NVIDIA's open models tuned for accuracy and efficiency.",
    models:[["nemotron-3-super","120b"]] },
  { id:"granite", name:"Granite", org:"IBM", about:"Enterprise-focused, compact models for business text and code.",
    models:[["granite3.1-moe","1b · 3b"],["granite-code","code line"]] },
  { id:"olmo", name:"OLMo", org:"Allen Institute for AI", about:"Fully open models — weights, data and training code published.",
    models:[["olmo2","7b · 13b"]] },

/* build the interactive zones */
HOTSPOTS.forEach(h => {
  const b = document.createElement("button");
  b.className = "hotspot";
  b.style.left = h.x + "%"; b.style.top = h.y + "%";
  b.style.width = h.w + "%"; b.style.height = h.h + "%";
  b.dataset.view = h.id;
  b.setAttribute("aria-label", h.label);
  b.setAttribute("title", h.label);
  b.innerHTML = `<span class="sr">${h.label}</span>`;
  b.addEventListener("click", () => openPanel(h.id, b));
  stage.appendChild(b);
});

const mobileNav=document.createElement("nav");
mobileNav.className="create-mobile-nav";
mobileNav.setAttribute("aria-label","Creative universe categories");
const mobileTitle=document.createElement("h2");mobileTitle.textContent="Explore NOXIS CREATE";mobileNav.append(mobileTitle);
const mobileGrid=document.createElement("div");mobileGrid.className="create-mobile-grid";mobileNav.append(mobileGrid);
HOTSPOTS.forEach(h=>{const b=document.createElement("button");b.type="button";b.textContent=h.label;b.addEventListener("click",()=>openPanel(h.id,b));mobileGrid.append(b);});
stage.after(mobileNav);

/* chip + entry renderers */
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;
const availChip = a => chip(a.includes("Local") && !a.includes("Both") ? "c-local" : a.includes("Both") ? "c-both" : "c-online", a);
const priceChip = p => chip(p.includes("Free") && !p.includes("Freemium") ? "c-free" : p.includes("Freemium") ? "c-freemium" : p.includes("open") ? "c-oss" : "c-paid", p);

function progHTML(p){
  return `<article class="prog">
    <h3><a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.name} ↗</a></h3>
    <div class="chips">${availChip(p.avail)}${priceChip(p.price)}</div>
    <p>${p.desc}</p>
    <p><b style="color:#e8ddc0">Can do:</b> ${p.can}</p>
    ${p.req ? `<p class="req"><b>System requirements:</b> ${p.req}</p>` : ``}
  </article>`;
}
function catHTML(cat){
  const c = PROGRAMS[cat];
  return `<p class="blurb">${c.blurb}</p>` + c.programs.map(progHTML).join("");
}
function famHTML(f, open){
  return `<details class="family"${open ? " open" : ""}>
    <summary><span class="fam">${f.name}</span><span class="org">${f.org}</span><span class="cnt">${f.models.length} models</span></summary>
    <div class="fam-body">${f.about}
      <div class="models">${f.models.map(m => `<a class="model" href="https://ollama.com/library/${m[0]}" target="_blank" rel="noopener noreferrer" title="${m[1]}">${m[0]}</a>`).join("")}</div>
    </div></details>`;
}
function familiesList(exclude){
  return OLLAMA_FAMILIES.filter(f => !exclude.includes(f.id)).map(f => famHTML(f, false)).join("");
}
const OLLAMA_REQS = `
  <p class="kicker">System requirements</p>
  <div class="prog">
    <div class="chips"><span class="chip c-local">Local</span><span class="chip c-free">Free</span><span class="chip c-oss">MIT license</span></div>
    <p class="req"><b>RAM:</b> 8 GB → 7–8B models · 16 GB → 14B · 32 GB+ → 32B+ &nbsp;|&nbsp; <b>GPU:</b> optional (NVIDIA / AMD / Apple silicon accelerate) &nbsp;|&nbsp; <b>OS:</b> Windows, macOS, Linux &nbsp;|&nbsp; <b>Disk:</b> 2–40 GB per model</p>
    <p class="req"><b>Verify live list:</b> <a href="https://ollama.com/library" style="color:#8fd0ff">ollama.com/library</a> — new models appear weekly; this page's list is one object (OLLAMA_FAMILIES) and grows without touching the design.</p>
  </div>`;

/* view renderer */
function render(view){
  const f = AI_CORE.familyTitle;
  if (view === "aicore"){
    gEl.textContent = AI_CORE.overview.glyph; tEl.textContent = AI_CORE.overview.title;
    sEl.textContent = AI_CORE.overview.sub;   bodyEl.innerHTML = AI_CORE.overview.html + FOOTER_HTML; return;
  }
  if (view === "fam-ollama"){
    gEl.textContent = AI_CORE.ollama.glyph; tEl.textContent = AI_CORE.ollama.title; sEl.textContent = AI_CORE.ollama.sub;
    bodyEl.innerHTML = `<p class="blurb">${AI_CORE.ollama.intro}</p>
      <code class="cmd"><span class="kw">$</span> ollama pull llama3.2   <span class="kw"># any family below</span>
<span class="kw">$</span> ollama run qwen3      <span class="kw"># chat in your terminal</span>
<span class="kw">$</span> ollama serve         <span class="kw"># local API on :11434</span></code>
      ${OLLAMA_REQS}
      <p class="kicker">Model families — click to expand</p>
      ${familiesList([])}${FOOTER_HTML}`; return;
  }
  if (view === "other-models"){
    gEl.textContent = AI_CORE.other.glyph; tEl.textContent = AI_CORE.other.title; sEl.textContent = AI_CORE.other.sub;
    bodyEl.innerHTML = `<p class="blurb">${AI_CORE.other.intro}</p>
      <p class="kicker">The extended catalog</p>
      ${familiesList(["llama","qwen","phi"])}${FOOTER_HTML}`; return;
  }
  if (view === "ubuntu"){
    gEl.textContent = "🐧"; tEl.textContent = AI_CORE.ubuntu.title; sEl.textContent = AI_CORE.ubuntu.sub;
    bodyEl.innerHTML = AI_CORE.ubuntu.html + FOOTER_HTML; return;
  }
  if (["fam-llama","fam-qwen","fam-phi"].includes(view)){
    const id = view.split("-")[1];
    const fam = OLLAMA_FAMILIES.find(x => x.id === id);
    const meta = f[id];
    gEl.textContent = meta.glyph; tEl.textContent = meta.name; sEl.textContent = `${fam.org} · via Ollama`;
    bodyEl.innerHTML = `<p class="blurb">${fam.about}</p>
      <p class="kicker">Models in the library</p>
      ${famHTML(fam, true)}
      ${OLLAMA_REQS}${FOOTER_HTML}`; return;
  }
  /* the 10 artistic categories */
  const c = PROGRAMS[view];
  gEl.textContent = c.glyph; tEl.textContent = c.title; sEl.textContent = c.sub;
  bodyEl.innerHTML = `<div class="crumbs"><button data-view="aicore" type="button">✳ AI CORE</button><button data-view="fam-ollama" type="button">♾️ Ollama</button></div>` + catHTML(view) + FOOTER_HTML;
}
function openPanel(view, trigger){
  lastTrigger = trigger || null;
  render(view);
  panel.classList.add("open");
  panel.removeAttribute("inert");
  hint.classList.add("gone");
  document.getElementById("closeBtn").focus({preventScroll:true});
  document.body.style.overflow = "hidden";
}
function closePanel(){
  panel.classList.remove("open");
  panel.setAttribute("inert","");
  document.body.style.overflow = "";
  if (lastTrigger) lastTrigger.focus({preventScroll:true});
}
document.getElementById("closeBtn").addEventListener("click", closePanel);
document.getElementById("backdrop").addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("open")) closePanel(); });
bodyEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (btn) openPanel(btn.dataset.view, btn);
});

/* one-time constellation reveal — shows that the symbols are alive */
if (!reduced){
  const spots = [...document.querySelectorAll(".hotspot")];
  spots.forEach((b,i) => setTimeout(() => {
    b.classList.add("reveal");
    setTimeout(() => b.classList.remove("reveal"), 650);
  }, 350 + i*150));
  setTimeout(() => hint.classList.add("gone"), 9000);
} else { hint.classList.add("gone"); }

/* ---------- optional "Living sky" overlay v2 (OFF by default, artwork untouched) ---------- */
const fx = document.getElementById("fx"), fxc = fx.getContext("2d");
const skyToggle = document.getElementById("skyToggle");
let skyOn = false, stars = [], meteors = [], raf = null, prevT = 0, lastMeteor = 0, nextMeteorIn = 1500;

/* soft glow sprites (radial gradient) — far brighter than flat dots */
function makeSprite(rgb){
  const R = 32, s = document.createElement("canvas");
  s.width = s.height = R * 2;
  const c = s.getContext("2d");
  const g = c.createRadialGradient(R, R, 0, R, R, R);
  g.addColorStop(0,   `rgba(${rgb},1)`);
  g.addColorStop(.22, `rgba(${rgb},.6)`);
  g.addColorStop(.55, `rgba(${rgb},.18)`);
  g.addColorStop(1,   `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(R, R, R, 0, Math.PI*2); c.fill();
  return s;
}
const SPRITES = [makeSprite("255,236,190"), makeSprite("150,200,255"), makeSprite("215,170,255"), makeSprite("255,252,240")];

function sizeFx(){
  const r = stage.getBoundingClientRect();
  fx.width  = Math.max(1, Math.round(r.width  * devicePixelRatio));
  fx.height = Math.max(1, Math.round(r.height * devicePixelRatio));
}
function seed(){
  stars = Array.from({length:150}, () => ({
    x: Math.random(), y: Math.random(),
    r: .9 + Math.random()*2.1,                    /* core radius, css px */
    big: Math.random() < .16,                     /* rare bright star with cross flare */
    rot: Math.random()*Math.PI,
    p: Math.random()*Math.PI*2,
    s: .5 + Math.random()*1.5,                    /* twinkle speed */
    sp: SPRITES[Math.floor(Math.random()*SPRITES.length)],
    dx: (Math.random()-.5)*.010, dy: (Math.random()-.5)*.006   /* slow drift, units/sec */
  }));
}
function spawnMeteor(){
  const toLeft = Math.random() < .5;
  const ang = (toLeft ? 145 : 35) * Math.PI/180 + (Math.random()-.5)*.4;
  const sp = 14 + Math.random()*10;               /* % of stage per second */
  meteors.push({
    x: .08 + Math.random()*.84, y: .02 + Math.random()*.22,
    vx: Math.cos(ang)*sp, vy: Math.abs(Math.sin(ang))*sp*.55 + 1.5,
    life: 1, decay: .55 + Math.random()*.5,
    len: 90 + Math.random()*100, w: 1.2 + Math.random()*1.4,
    c: Math.random() < .55 ? "255,236,190" : "160,205,255"
  });
}
function tick(t){
  const dt = Math.min(.06, prevT ? (t - prevT)/1000 : .016);
  prevT = t;
  const d = devicePixelRatio, W = fx.width, H = fx.height;
  fxc.clearRect(0, 0, W, H);
  /* stars: halo sprite + bright core + rare cross flares */
  for (const st of stars){
    st.x += st.dx*dt; st.y += st.dy*dt;
    if (st.x < -.02) st.x = 1.02; else if (st.x > 1.02) st.x = -.02;
    if (st.y < -.02) st.y = 1.02; else if (st.y > 1.02) st.y = -.02;
    const a = .22 + .78*Math.abs(Math.sin(t/1000*st.s + st.p));
    const x = st.x*W, y = st.y*H;
    const h = st.r*14*d*(st.big ? 1.9 : 1);
    fxc.globalAlpha = a*(st.big ? 1 : .8);
    fxc.drawImage(st.sp, x-h/2, y-h/2, h, h);
    fxc.globalAlpha = Math.min(1, .35 + .65*a);
    fxc.fillStyle = "rgba(255,252,242,.95)";
    fxc.beginPath(); fxc.arc(x, y, st.r*d*.75, 0, Math.PI*2); fxc.fill();
    if (st.big && a > .62){
      fxc.globalAlpha = (a-.62)*1.6;
      fxc.strokeStyle = "rgba(255,244,214,.9)";
      fxc.lineWidth = 1.1*d; fxc.lineCap = "round";
      const L = h*1.15;
      fxc.save(); fxc.translate(x, y); fxc.rotate(st.rot);
      fxc.beginPath(); fxc.moveTo(-L/2,0); fxc.lineTo(L/2,0);
      fxc.moveTo(0,-L/2); fxc.lineTo(0,L/2); fxc.stroke();
      fxc.restore();
    }
  }
  /* shooting stars every few seconds */
  if (t - lastMeteor > nextMeteorIn){ spawnMeteor(); lastMeteor = t; nextMeteorIn = 2600 + Math.random()*5500; }
  for (let i = meteors.length-1; i >= 0; i--){
    const m = meteors[i];
    m.x += m.vx*dt; m.y += m.vy*dt; m.life -= m.decay*dt;
    if (m.life <= 0 || m.x < -.15 || m.x > 1.15 || m.y > 1.15){ meteors.splice(i,1); continue; }
    const a = Math.sin(Math.min(1, m.life)*Math.PI);
    const tx = m.x*W, ty = m.y*H;
    const nl = Math.hypot(m.vx, m.vy) || 1, L = m.len*d;
    const ex = tx - m.vx/nl*L, ey = ty - m.vy/nl*L;
    const g = fxc.createLinearGradient(tx, ty, ex, ey);
    g.addColorStop(0, `rgba(${m.c},${.95*a})`);
    g.addColorStop(1, `rgba(${m.c},0)`);
    fxc.globalAlpha = 1;
    fxc.strokeStyle = g; fxc.lineWidth = m.w*d; fxc.lineCap = "round";
    fxc.beginPath(); fxc.moveTo(tx, ty); fxc.lineTo(ex, ey); fxc.stroke();
    fxc.globalAlpha = a;
    fxc.drawImage(SPRITES[0], tx-11*d, ty-11*d, 22*d, 22*d);
  }
  fxc.globalAlpha = 1;
  raf = requestAnimationFrame(tick);
}
function setSky(on){
  skyOn = on;
  skyToggle.setAttribute("aria-pressed", String(on));
  skyToggle.textContent = on ? "✦ Living sky: on" : "✦ Living sky: off";
  if (on && !reduced){
    sizeFx(); seed(); meteors = []; prevT = 0; lastMeteor = 0; nextMeteorIn = 1500;
    raf = requestAnimationFrame(tick);
  }
  else { cancelAnimationFrame(raf); fxc.clearRect(0,0,fx.width,fx.height); }
}
skyToggle.addEventListener("click", () => setSky(!skyOn));
addEventListener("resize", () => { if (skyOn) sizeFx(); });
</script>
</body>
